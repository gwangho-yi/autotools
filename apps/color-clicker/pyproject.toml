[project]
name = "color-clicker"
version = "0.1.0"
description = "Automated mouse clicker (color-triggered, continuous)"
requires-python = ">=3.14"
dependencies = [
    "autotools_shared",
    "pyside6>=6.11.1",
    "pynput>=1.7.7",
    "pyinstaller>=6.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-qt>=4.4.0"]
