name: Release Windows x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
      codename:
        description: 'Optional codename shown in the release title (e.g. Catch Catch)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            CODENAME="$(git tag -l --format='%(contents:subject)' "$TAG")"
          else
            TAG="${{ github.event.inputs.version }}"
            CODENAME="${{ github.event.inputs.codename }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ -n "$CODENAME" ]]; then
            echo "title=$TAG — $CODENAME" >> $GITHUB_OUTPUT
          else
            echo "title=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build motion-capture
        working-directory: apps/motion-capture
        run: |
          uv sync
          uv run python scripts/make_icon.py
          uv run pyinstaller motion-capture-windows-x64.spec --clean --noconfirm

      - name: Build color-capture
        working-directory: apps/color-capture
        run: |
          uv sync
          uv run python scripts/make_icon.py
          uv run pyinstaller color-capture-windows-x64.spec --clean --noconfirm

      - name: Build motion-clicker
        working-directory: apps/motion-clicker
        run: |
          uv sync
          uv run python scripts/make_icon.py
          uv run pyinstaller motion-clicker-windows-x64.spec --clean --noconfirm

      - name: Build color-clicker
        working-directory: apps/color-clicker
        run: |
          uv sync
          uv run python scripts/make_icon.py
          uv run pyinstaller color-clicker-windows-x64.spec --clean --noconfirm

      - name: Rename with version
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          cp apps/motion-capture/dist/motion-capture.exe "motion-capture-${TAG}.exe"
          cp apps/color-capture/dist/color-capture.exe "color-capture-${TAG}.exe"
          cp apps/motion-clicker/dist/motion-clicker.exe "motion-clicker-${TAG}.exe"
          cp apps/color-clicker/dist/color-clicker.exe "color-clicker-${TAG}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          generate_release_notes: true
          files: |
            motion-capture-${{ steps.ver.outputs.tag }}.exe
            color-capture-${{ steps.ver.outputs.tag }}.exe
            motion-clicker-${{ steps.ver.outputs.tag }}.exe
            color-clicker-${{ steps.ver.outputs.tag }}.exe
