name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build motion-capture
        working-directory: apps/motion-capture
        run: |
          uv sync
          uv run python scripts/make_icon.py
          uv run pyinstaller motion-capture-windows-x64.spec --clean --noconfirm

      - name: Build color-capture
        working-directory: apps/color-capture
        run: |
          uv sync
          uv run python scripts/make_icon.py
          uv run pyinstaller color-capture-windows-x64.spec --clean --noconfirm

      - name: Build motion-clicker
        working-directory: apps/motion-clicker
        run: |
          uv sync
          uv run python scripts/make_icon.py
          uv run pyinstaller motion-clicker-windows-x64.spec --clean --noconfirm

      - name: Build color-clicker
        working-directory: apps/color-clicker
        run: |
          uv sync
          uv run python scripts/make_icon.py
          uv run pyinstaller color-clicker-windows-x64.spec --clean --noconfirm

      - name: Upload motion-capture
        uses: actions/upload-artifact@v4
        with:
          name: motion-capture-windows-x64
          path: apps/motion-capture/dist/motion-capture.exe
          retention-days: 5

      - name: Upload color-capture
        uses: actions/upload-artifact@v4
        with:
          name: color-capture-windows-x64
          path: apps/color-capture/dist/color-capture.exe
          retention-days: 5

      - name: Upload motion-clicker
        uses: actions/upload-artifact@v4
        with:
          name: motion-clicker-windows-x64
          path: apps/motion-clicker/dist/motion-clicker.exe
          retention-days: 5

      - name: Upload color-clicker
        uses: actions/upload-artifact@v4
        with:
          name: color-clicker-windows-x64
          path: apps/color-clicker/dist/color-clicker.exe
          retention-days: 5
