[project]
name = "auto-capture"
version = "0.1.0"
description = "Screen change detection and cursor automation"
requires-python = ">=3.14"
dependencies = [
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "pyinstaller>=6.20.0",
    "pynput>=1.7.7",
    "pyside6>=6.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
