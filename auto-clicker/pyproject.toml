[project]
name = "auto-clicker"
version = "0.2.1"
description = "Automated mouse click sequencer"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.1",
    "pynput>=1.7.7",
    "pyinstaller>=6.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-qt>=4.4.0"]
build = ["pyinstaller>=6.20.0"]
