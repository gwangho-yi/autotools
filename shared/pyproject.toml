[project]
name = "autotools_shared"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["pyside6>=6.11.1", "mss>=10.2.0", "numpy>=2.4.6", "pynput>=1.7.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotools_shared"]
